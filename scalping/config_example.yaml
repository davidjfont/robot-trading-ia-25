# Scalping Configuration Example
# Add this section to your config.yaml

scalping:
  enabled: true
  
  # Parámetros de ejecución
  cycle_interval_seconds: 10      # Ciclo cada 10 segundos
  stop_loss_pips: 3               # SL muy corto (1-3 pips)
  take_profit_pips: 6             # TP 2:1 ratio
  volume: 0.01                    # Volumen conservador
  max_trade_duration_seconds: 120 # Máximo 2 minutos en mercado
  
  # Control de riesgo
  max_trades_per_session: 10      # Máx operaciones por sesión
  max_consecutive_losses: 2       # Bloqueo después de 2 pérdidas
  max_daily_loss_percent: 2.0     # Máx pérdida diaria
  max_spread_multiplier: 2.0      # Bloquear si spread > 2x normal
  
  # Contexto de mercado
  min_atr_threshold: 0.0005       # ATR mínimo para operar
  
  # Sesiones preferidas (UTC)
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
    london:
      start: "08:00" 
      end: "16:00"
    ny:
      start: "13:00"
      end: "21:00"
